name: Poll campsite availability

# D-08: 5-minute cadence. GitHub's scheduler is best-effort and may skew or skip
# runs under load — that is acceptable here; dedup state makes a skipped cycle
# harmless and a doubled cycle idempotent.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# D-10: queue overlapping runs, never cancel one mid-flight. A cancelled run could
# be interrupted between the email send and the state commit, producing a duplicate
# alert next cycle. Do NOT change this to `true`.
concurrency:
  group: poller
  cancel-in-progress: false

# Least privilege: only what the state commit-back push needs. Public repos default
# GITHUB_TOKEN to read-only for contents, which would make the push fail with 403.
permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run poller
        id: poll
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
          RUN_SUMMARY_FILE: run-summary.json
        run: npm start

      # D-01/D-02: append this cycle's RunSummary to a rolling history log, capped at 50
      # entries (~4h at the 5-minute cadence) so the committed file never grows unbounded.
      - name: Append run to history log
        if: always()
        run: |
          set -euo pipefail
          # A fatal crash in the poller (e.g. invalid watches.json) means cli.ts never
          # returned a summary to write. Synthesise a FAILED entry so this always-run step
          # still produces an honest record and runs.json keeps a uniform RunSummary shape.
          if [ ! -f run-summary.json ]; then
            NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            REASON="poller exited without producing a run summary"
            jq -n --arg now "$NOW" --arg reason "$REASON" '{
              startedAt: $now,
              finishedAt: $now,
              checked: 0,
              outcomes: [{ watchId: "(run)", status: "FAILED", reason: $reason }],
              newMatches: [],
              failed: [{ watchId: "(run)", reason: $reason }],
              noMatch: []
            }' > run-summary.json
          fi
          if [ ! -f runs.json ]; then echo '[]' > runs.json; fi
          jq --slurpfile new run-summary.json '. + $new | .[-50:]' runs.json > runs.json.tmp
          mv runs.json.tmp runs.json
          echo "runs.json now has $(jq 'length' runs.json) entries"

      - name: Commit dedup state and run history
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json runs.json
          git commit -m "chore: update dedup state and run history [skip ci]"
          git push
